<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClarificationCard 原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: #f5f5f7;
    display: flex;
    height: 100vh;
    align-items: center;
    justify-content: center;
  }

  /* ---- Chat panel ---- */
  .chat-panel {
    width: 380px;
    height: 640px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    padding: 14px 16px;
    border-bottom: 1px solid #e5e5ea;
    font-size: 13px;
    font-weight: 600;
    color: #1c1c1e;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chat-header .dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* ---- Message bubbles ---- */
  .msg {
    max-width: 100%;
    font-size: 12.5px;
    line-height: 1.5;
    border-radius: 12px;
    padding: 8px 12px;
    font-family: "SF Mono", "Menlo", monospace;
  }
  .msg.user {
    background: #0071e3;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    max-width: 80%;
  }
  .msg.system {
    color: #8e8e93;
    text-align: center;
    font-size: 11px;
    background: none;
    padding: 2px 0;
  }
  .msg.ai {
    background: #f2f2f7;
    color: #1c1c1e;
    border: 1px solid #e5e5ea;
    border-bottom-left-radius: 4px;
    max-width: 90%;
  }

  /* ---- ClarificationCard ---- */
  .clarification-card {
    background: #fff;
    border: 1.5px solid #e5e5ea;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    transition: all 0.3s ease;
  }

  .card-header {
    padding: 10px 14px;
    background: #f9f9fb;
    border-bottom: 1px solid #e5e5ea;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #1c1c1e;
  }
  .card-header .icon { font-size: 14px; }

  .card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 14px; }

  /* ---- Question block ---- */
  .question-block { display: flex; flex-direction: column; gap: 7px; }
  .question-label {
    font-size: 12px;
    font-weight: 600;
    color: #1c1c1e;
  }
  .question-sub {
    font-size: 11px;
    color: #636366;
    margin-top: -4px;
  }

  /* ---- Options grid ---- */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .option-btn {
    background: #f2f2f7;
    border: 1.5px solid transparent;
    border-radius: 10px;
    padding: 8px 10px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .option-btn:hover { background: #e8e8ed; border-color: #c7c7cc; }
  .option-btn.selected {
    background: #e8f0fe;
    border-color: #0071e3;
  }
  .option-btn .opt-label {
    font-size: 12px;
    font-weight: 600;
    color: #1c1c1e;
  }
  .option-btn.selected .opt-label { color: #0071e3; }
  .option-btn .opt-desc {
    font-size: 10.5px;
    color: #8e8e93;
    line-height: 1.3;
  }
  .option-btn.selected .opt-desc { color: #4a90d9; }

  /* ---- Other input ---- */
  .other-input {
    display: none;
    margin-top: 2px;
  }
  .other-input.visible { display: block; }
  .other-input textarea {
    width: 100%;
    border: 1.5px solid #0071e3;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-family: inherit;
    color: #1c1c1e;
    resize: none;
    outline: none;
    background: #f5f9ff;
    height: 56px;
  }

  /* ---- Free text question ---- */
  .free-input {
    border: 1.5px solid #e5e5ea;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-family: inherit;
    color: #1c1c1e;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  .free-input:focus { border-color: #0071e3; }

  /* ---- Card footer ---- */
  .card-footer {
    padding: 10px 14px;
    border-top: 1px solid #e5e5ea;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    background: #f9f9fb;
  }
  .btn-skip {
    background: none;
    border: none;
    color: #8e8e93;
    font-size: 12px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 7px;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-skip:hover { background: #e5e5ea; color: #636366; }

  .btn-confirm {
    background: #0071e3;
    color: #fff;
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 16px;
    border-radius: 7px;
    font-family: inherit;
    transition: background 0.15s;
    opacity: 0.4;
    pointer-events: none;
  }
  .btn-confirm.ready { opacity: 1; pointer-events: all; }
  .btn-confirm.ready:hover { background: #005ec2; }

  /* ---- Collapsed / done state ---- */
  .clarification-card.done {
    border-color: #34c759;
    background: #f9fef9;
  }
  .clarification-card.done .card-header {
    background: #f0faf0;
    border-bottom-color: #c6f0ce;
  }
  .card-summary {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .summary-row {
    font-size: 11.5px;
    color: #3a3a3c;
    display: flex;
    gap: 6px;
  }
  .summary-row .sq { color: #636366; flex-shrink: 0; }
  .summary-row .sa { color: #0071e3; font-weight: 600; }

  /* ---- Input bar ---- */
  .chat-input-bar {
    border-top: 1px solid #e5e5ea;
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .chat-input-bar input {
    flex: 1;
    background: #f2f2f7;
    border: 1px solid #e5e5ea;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12.5px;
    font-family: monospace;
    outline: none;
    color: #1c1c1e;
  }
  .chat-input-bar input:focus { border-color: #0071e3; background: #fff; }
  .send-btn {
    background: #0071e3;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .send-btn:hover { background: #005ec2; }

  /* ---- Divider ---- */
  .q-divider {
    height: 1px;
    background: #e5e5ea;
    margin: 0 -14px;
    padding: 0;
  }
</style>
</head>
<body>

<div class="chat-panel">
  <div class="chat-header">
    <div class="dot"></div>
    Shipyard Chat
  </div>

  <div class="chat-messages" id="messages">
    <div class="msg system">Hi! Tell me what to build.</div>
    <div class="msg user">> 帮我做一个 Apple 风格的登录页</div>
    <div class="msg ai">好的，我来分析一下这个需求...</div>

    <!-- ClarificationCard — 待回答状态 -->
    <div class="clarification-card" id="card-pending">
      <div class="card-header">
        <span class="icon">💬</span>
        开始之前，我需要确认几个问题
      </div>
      <div class="card-body">

        <!-- Q1: 带选项 -->
        <div class="question-block">
          <div class="question-label">1. Apple 风格具体指什么视觉特征？</div>
          <div class="options-grid">
            <button class="option-btn" onclick="selectOption(this, 'q1')" data-value="极简 + 毛玻璃">
              <span class="opt-label">极简 + 毛玻璃</span>
              <span class="opt-desc">大圆角、backdrop-filter blur</span>
            </button>
            <button class="option-btn" onclick="selectOption(this, 'q1')" data-value="高对比度动效">
              <span class="opt-label">高对比度动效</span>
              <span class="opt-desc">Spring 动画、页面切换</span>
            </button>
            <button class="option-btn" onclick="selectOption(this, 'q1')" data-value="系统级组件">
              <span class="opt-label">系统级组件</span>
              <span class="opt-desc">UIKit / SwiftUI 外观</span>
            </button>
            <button class="option-btn" onclick="selectOption(this, 'q1', true)" data-value="other">
              <span class="opt-label">其他...</span>
              <span class="opt-desc">自由描述</span>
            </button>
          </div>
          <div class="other-input" id="other-q1">
            <textarea placeholder="描述你想要的风格..." oninput="checkReady()"></textarea>
          </div>
        </div>

        <div class="q-divider"></div>

        <!-- Q2: 退化为纯文字 -->
        <div class="question-block">
          <div class="question-label">2. 登录方式需要支持哪些？</div>
          <div class="question-sub">（AI 判断此问题选项化意义不大，直接输入）</div>
          <input class="free-input" id="q2-input" type="text"
            placeholder="例如：账号密码 + Apple ID"
            oninput="checkReady()" />
        </div>

      </div>
      <div class="card-footer">
        <button class="btn-skip" onclick="skipCard()">跳过，直接开始</button>
        <button class="btn-confirm" id="confirm-btn" onclick="confirmCard()">确认</button>
      </div>
    </div>

    <!-- ClarificationCard — 已回答状态（hidden initially） -->
    <div class="clarification-card done" id="card-done" style="display:none">
      <div class="card-header">
        <span class="icon">✅</span>
        已确认，开始执行
      </div>
      <div class="card-summary" id="card-summary"></div>
    </div>

    <div id="after-confirm"></div>
  </div>

  <div class="chat-input-bar">
    <input type="text" placeholder="Build something, retry a node..." />
    <button class="send-btn">Send</button>
  </div>
</div>

<script>
  const answers = { q1: null, q2: null };

  function selectOption(btn, qid, isOther = false) {
    // 清除同组选中
    btn.closest('.options-grid').querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    const otherBox = document.getElementById(`other-${qid}`);
    if (isOther) {
      otherBox.classList.add('visible');
      answers[qid] = null; // 等文字输入
    } else {
      otherBox.classList.remove('visible');
      answers[qid] = btn.dataset.value;
    }
    checkReady();
  }

  function checkReady() {
    const q2 = document.getElementById('q2-input').value.trim();

    // q1: 选了选项 or 填了 other
    const q1Selected = document.querySelector('.option-btn.selected:not([data-value="other"])');
    const q1OtherVisible = document.getElementById('other-q1').classList.contains('visible');
    const q1OtherVal = document.querySelector('#other-q1 textarea')?.value.trim();
    const q1Ready = q1Selected || (q1OtherVisible && q1OtherVal);

    if (q1OtherVisible && q1OtherVal) answers.q1 = q1OtherVal;

    const ready = q1Ready && q2.length > 0;
    const btn = document.getElementById('confirm-btn');
    btn.classList.toggle('ready', !!ready);
    if (q2) answers.q2 = q2;
  }

  function confirmCard() {
    const q2val = document.getElementById('q2-input').value.trim();
    const q1val = answers.q1;
    if (!q1val || !q2val) return;

    // 切换到 done 状态
    document.getElementById('card-pending').style.display = 'none';
    const done = document.getElementById('card-done');
    done.style.display = 'block';

    const summary = document.getElementById('card-summary');
    summary.innerHTML = `
      <div class="summary-row">
        <span class="sq">Q1 视觉风格</span>
        <span class="sa">→ ${q1val}</span>
      </div>
      <div class="summary-row">
        <span class="sq">Q2 登录方式</span>
        <span class="sa">→ ${q2val}</span>
      </div>
    `;

    // 模拟 AI 开始执行
    setTimeout(() => {
      const after = document.getElementById('after-confirm');
      after.innerHTML = `<div class="msg ai">收到！开始构建 ${q1val} 风格的登录页，支持 ${q2val}...</div>`;
      document.querySelector('.chat-messages').scrollTop = 99999;
    }, 400);

    document.querySelector('.chat-messages').scrollTop = 99999;
  }

  function skipCard() {
    document.getElementById('card-pending').style.display = 'none';
    const after = document.getElementById('after-confirm');
    after.innerHTML = `<div class="msg ai">好的，按默认假设开始...</div>`;
  }
</script>
</body>
</html>
